services:
  legalhub:
    build: .
    container_name: legalhub_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ssl-keyfile=localhost-key.pem --ssl-certfile=localhost.pem
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./app/model:/app/app/model
      - ./whoosh_index:/app/whoosh_index
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - legalhub-network

  db:
    image: postgres:16
    container_name: legalhub_db
    restart: always
    environment:
      POSTGRES_USER: legalhub_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: legalhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legalhub-network

  redis:
    image: redis:7
    container_name: redis_broker
    restart: always
    ports:
      - "6379:6379"
    networks:
      - legalhub-network

  celery_worker:
    build: .
    container_name: legalhub_worker
    command: celery -A app.automatisation.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - legalhub-network

  celery_beat:
    build: .
    container_name: legalhub_beat
    command: celery -A app.automatisation.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - legalhub-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

volumes:
  postgres_data:
  minio_data:
  whoosh_data:

networks:
  legalhub-network:
    driver: bridge