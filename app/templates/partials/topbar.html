<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
        <i class="fa fa-bars"></i>
    </button>

    <form id="searchForm" class="d-none d-sm-inline-block form-inline mr-auto ml-md-3 my-2 my-md-0 mw-100 navbar-search">
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control bg-light border-0 small"
                   placeholder="Rechercher un dossier (nom, numéro, contenu)..." aria-label="Search">
            <div class="input-group-append">
                <button class="btn btn-primary" type="submit">
                    <i class="fas fa-search fa-sm"></i>
                </button>
            </div>
        </div>
        <div id="searchResults" class="dropdown-menu dropdown-menu-left shadow animated--grow-in"
             style="display: none; width: 100%; max-height: 400px; overflow-y: auto;">
        </div>
    </form>

    <ul class="navbar-nav ml-auto">

        <li class="nav-item dropdown no-arrow d-sm-none">
            <a class="nav-link dropdown-toggle" href="#" id="searchDropdown" role="button"
                data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-search fa-fw"></i>
            </a>
            <div class="dropdown-menu dropdown-menu-right p-3 shadow animated--grow-in"
                aria-labelledby="searchDropdown">
                <form class="form-inline mr-auto w-100 navbar-search" id="mobileSearchForm">
                    <div class="input-group">
                        <input type="text" id="mobileSearchInput" class="form-control bg-light border-0 small"
                            placeholder="Rechercher..." aria-label="Search"
                            aria-describedby="basic-addon2">
                        <div class="input-group-append">
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-search fa-sm"></i>
                            </button>
                        </div>
                    </div>
                    <div id="mobileSearchResults" class="dropdown-menu dropdown-menu-left shadow animated--grow-in mt-2"
                         style="display: none; width: 100%; max-height: 300px; overflow-y: auto;">
                    </div>
                </form>
            </div>
        </li>

        <div class="topbar-divider d-none d-sm-block"></div>

        <li class="nav-item dropdown no-arrow">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small">Maître {{ user.nom }}</span>
                <img class="img-profile rounded-circle"
                    src="/static/img/undraw_profile.svg">
            </a>
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                aria-labelledby="userDropdown">
                <a class="dropdown-item" href="/profil">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                    Profil
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                    Déconnexion
                </a>
            </div>
        </li>

    </ul>

</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function performSearch(query, limit = 10) {
        return fetch(`/search?q=${encodeURIComponent(query)}&limit=${limit}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                return data;
            })
            .catch(error => {
                console.error('Erreur de recherche:', error);
                throw error;
            });
    }

    function displayResults(containerId, results, total, query) {
        const container = document.getElementById(containerId);
        if (!results || results.length === 0) {
            container.innerHTML = '<div class="dropdown-item text-muted">Aucun résultat trouvé pour "' + query + '"</div>';
            container.style.display = 'block';
            return;
        }

        let html = `<h6 class="dropdown-header">${total} dossier(s) trouvé(s)</h6>`;

        results.forEach(result => {
            const dossierId = result.id ? result.id.split('_')[1] : null;
            const url = dossierId ? `/dossiers/${dossierId}` : '#';  // Lien vers la page dossier

            let tribunal = '';
            if (result.entites) {
                const tribunalMatch = result.entites.match(/tribunal_malgache:([^ ]+)/);
                if (tribunalMatch) {
                    tribunal = tribunalMatch[1];
                }
            }

            const clientNom = 'Client anonyme';

            html += `
                <a class="dropdown-item" href="${url}">
                    <div class="py-2">
                        <div class="font-weight-bold text-primary">
                            ${result.numero_dossier || 'N/A'}
                        </div>
                        <div class="text-truncate">${result.nom_dossier || 'Sans nom'}</div>
                        <div class="small text-muted">
                            <i class="fas fa-user"></i> ${clientNom}
                            ${tribunal ? ' | <i class="fas fa-gavel"></i> ' + tribunal : ''}
                            ${result.score ? ` | Score: ${result.score.toFixed(2)}` : ''}
                        </div>
                        <div class="small text-gray-500 mt-1">${(result.contenu_resume || '').substring(0, 100)}...</div>
                    </div>
                </a>
            `;
        });

        html += `<div class="dropdown-divider"></div>`;
        html += `<a class="dropdown-item text-center small text-primary" href="/dossiers?search=${encodeURIComponent(query)}">Voir tous les résultats</a>`;

        container.innerHTML = html;
        container.style.display = 'block';
    }

    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let desktopTimeout;

    searchInput.addEventListener('input', function() {
        clearTimeout(desktopTimeout);
        const query = this.value.trim();

        if (query.length < 2) {
            searchResults.style.display = 'none';
            return;
        }

        desktopTimeout = setTimeout(() => {
            performSearch(query)
                .then(data => {
                    displayResults('searchResults', data.results, data.total, data.query);
                })
                .catch(error => {
                    searchResults.innerHTML = '<div class="dropdown-item text-danger">Erreur de recherche</div>';
                    searchResults.style.display = 'block';
                });
        }, 300);
    });

    searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (query.length >= 2) {
            performSearch(query)
                .then(data => {
                    displayResults('searchResults', data.results, data.total, data.query);
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    alert('Erreur lors de la recherche. Veuillez réessayer.');
                });
        }
    });

    const mobileSearchForm = document.getElementById('mobileSearchForm');
    const mobileSearchInput = document.getElementById('mobileSearchInput');
    const mobileSearchResults = document.getElementById('mobileSearchResults');
    let mobileTimeout;

    mobileSearchInput.addEventListener('input', function() {
        clearTimeout(mobileTimeout);
        const query = this.value.trim();

        if (query.length < 2) {
            mobileSearchResults.style.display = 'none';
            return;
        }

        mobileTimeout = setTimeout(() => {
            performSearch(query)
                .then(data => {
                    displayResults('mobileSearchResults', data.results, data.total, data.query);
                })
                .catch(error => {
                    mobileSearchResults.innerHTML = '<div class="dropdown-item text-danger">Erreur de recherche</div>';
                    mobileSearchResults.style.display = 'block';
                });
        }, 300);
    });

    mobileSearchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const query = mobileSearchInput.value.trim();
        if (query.length >= 2) {
            performSearch(query)
                .then(data => {
                    displayResults('mobileSearchResults', data.results, data.total, data.query);
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    alert('Erreur lors de la recherche. Veuillez réessayer.');
                });
        }
    });

    document.addEventListener('click', function(e) {
        if (!searchForm.contains(e.target) && !document.getElementById('searchDropdown').contains(e.target)) {
            searchResults.style.display = 'none';
            mobileSearchResults.style.display = 'none';
        }
    });
});
</script>
