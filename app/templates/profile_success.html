{% extends "base.html" %}
{% block title %}Confirmation{% endblock %}

{% block content %}
<div class="container-fluid mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="text-success mb-3">{{ title or "Action réussie !" }}</h3>
                    <p class="text-muted mb-4">{{ message or "Votre demande a été traitée avec succès." }}</p>

                    {% if show_login_button %}
                    <a href="/auth/login" class="btn btn-primary me-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                    </a>
                    {% endif %}

                    <a href="/profil" class="btn btn-outline-primary">
                        <i class="fas fa-user me-2"></i>Retour au profil
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
