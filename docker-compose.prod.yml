version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app/model:/app/app/model:ro
      - ./whoosh_index:/app/whoosh_index
    environment:
      - MODE=prod
    depends_on:
      - db
      - redis
      - minio
    restart: unless-stopped

  celery:
    build: .
    command: celery -A app.services.celery_tasks worker --loglevel=info --concurrency=4
    volumes: [ ... ]
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

  db:
    image: postgres:16
    container_name: legalhub_db
    restart: always
    environment:
      POSTGRES_USER: legalhub_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: legalhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legalhub-network

